<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Vault - The Walker Crown Vault</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#0f172a',
                        green: '#064e3b',
                        gold: '#eab308',
                        'gold-hover': '#ca8a04',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                        script: ['Great Vibes', 'cursive'],
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Input focus rings */
        input:focus {
            outline: none;
            border-color: #eab308;
            box-shadow: 0 0 0 3px rgba(234, 179, 8, 0.2);
        }
    </style>
</head>
<body class="antialiased text-gray-800 bg-navy min-h-screen flex flex-col relative overflow-hidden">

    <!-- Decorative Background -->
    <div class="absolute top-0 left-0 w-1/2 h-full bg-gold opacity-10 -skew-x-12 transform origin-top-left z-0"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-green rounded-full blur-[120px] opacity-30 z-0"></div>

    <!-- Minimal Header -->
    <header class="relative z-10 p-6">
        <a href="index.html" class="inline-flex items-center text-gray-400 hover:text-white transition gap-2 text-sm font-medium">
            <i class="fa-solid fa-arrow-left"></i> Back to Home
        </a>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center p-4 relative z-10">
        <div class="w-full max-w-lg">
            <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
                <div class="p-8 sm:p-10">
                    <div class="text-center mb-8">
                        <h2 class="font-serif text-3xl font-bold text-navy">Secure Your Legacy</h2>
                        <p class="text-sm text-gray-500 mt-2">Create your family's digital vault today.</p>
                    </div>

                    <form action="#" method="POST" class="space-y-4">
                        
                        <div>
                            <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i class="fa-regular fa-user text-gray-400"></i>
                                </div>
                                <input type="text" id="name" name="name" class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg text-sm placeholder-gray-400 transition-colors" placeholder="John Doe" required>
                            </div>
                        </div>

                        <div>
                            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i class="fa-regular fa-envelope text-gray-400"></i>
                                </div>
                                <input type="email" id="email" name="email" class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg text-sm placeholder-gray-400 transition-colors" placeholder="you@example.com" required>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <i class="fa-solid fa-lock text-gray-400"></i>
                                    </div>
                                    <input type="password" id="password" name="password" class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg text-sm placeholder-gray-400 transition-colors" placeholder="••••••••" required>
                                </div>
                            </div>
                            
                            <div>
                                <label for="confirm_password" class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <i class="fa-solid fa-shield-check text-gray-400"></i>
                                    </div>
                                    <input type="password" id="confirm_password" name="confirm_password" class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg text-sm placeholder-gray-400 transition-colors" placeholder="••••••••" required>
                                </div>
                            </div>
                        </div>

                        <div class="flex items-start gap-2 mt-4">
                            <input type="checkbox" id="terms" required class="mt-1 rounded border-gray-300 text-gold focus:ring-gold accent-gold w-4 h-4 cursor-pointer">
                            <label for="terms" class="text-xs text-gray-500 leading-tight cursor-pointer">
                                I agree to the <a href="#" class="text-navy font-semibold hover:text-gold transition">Terms of Service</a>, <a href="#" class="text-navy font-semibold hover:text-gold transition">Privacy Policy</a>, and consent to strict data encryption standards.
                            </label>
                        </div>

                        <button type="submit" class="w-full bg-gold text-navy font-bold py-3.5 mt-6 rounded-lg hover:bg-gold-hover transition shadow-lg flex items-center justify-center gap-2">
                            Create My Vault <i class="fa-solid fa-vault"></i>
                        </button>
                    </form>
                </div>
                
                <div class="bg-gray-50 p-6 text-center border-t border-gray-100">
                    <p class="text-sm text-gray-600">Already have a vault? <a href="login.html" class="text-navy font-bold hover:text-gold transition">Sign In</a></p>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
